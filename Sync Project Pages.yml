name: Sync Project Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # každou hodinu

jobs:
  sync-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IvanekLumberjack888.github.io
        uses: actions/checkout@v4

      - name: Sync Bulls&Cows index.md
        run: |
          mkdir -p bulls-cows
          curl -sL https://raw.githubusercontent.com/IvanekLumberjack888/Bulls-Cows/main/index.md -o bulls-cows/index.md

      - name: Sync Election Scraper index.md
        run: |
          mkdir -p election-scraper
          curl -sL https://raw.githubusercontent.com/IvanekLumberjack888/Elections-Scraper/main/index.md -o election-scraper/index.md

      - name: Sync SQL-Engeto index.md
        run: |
          mkdir -p sql-engeto
          curl -sL https://raw.githubusercontent.com/IvanekLumberjack888/SQL-Engeto/main/index.md -o sql-engeto/index.md

      - name: Sync PowerBI index.md
        run: |
          mkdir -p powerbi
          curl -sL https://raw.githubusercontent.com/IvanekLumberjack888/PowerBI-for-Engeto/main/index.md -o powerbi/index.md

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add .
          git diff --cached --quiet || git commit -m "Sync project index.md pages"
          git push
