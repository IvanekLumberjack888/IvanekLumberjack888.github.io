name: Sync Bulls-and-Cows page

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  sync-bulls-and-cows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout web repo
        uses: actions/checkout@v4

      - name: Download index.md from Bulls-and-Cows
        run: |
          mkdir -p bulls-and-cows
          curl -sL https://raw.githubusercontent.com/IvanekLumberjack888/Bulls-and-Cows/main/files/index.md -o bulls-and-cows/index.md

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add bulls-and-cows/index.md
          git diff --cached --quiet || git commit -m "Update Bulls-and-Cows page"
          git push
